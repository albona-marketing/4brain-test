<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="150" height="40" viewBox="0 0 150 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Background shape -->
  <rect x="5" y="5" width="140" height="30" rx="15" fill="#f8f9fa" opacity="0.8"/>
  
  <!-- 4-Brain text -->
  <text x="20" y="27" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#333">4-Brain</text>
  
  <!-- Brain icon -->
  <g transform="translate(100, 20) scale(0.15)">
    <path d="M60,10 C90,0 120,20 120,50 C120,80 100,100 80,110 C60,120 40,120 20,110 C0,100 -20,80 -20,50 C-20,20 10,0 40,10 C50,5 50,5 60,10 Z" 
          fill="#f8f0ff" stroke="#8B5CF6" stroke-width="4"/>
    
    <!-- Brain regions with different colors -->
    <path d="M40,10 C50,5 50,5 60,10 C70,15 75,25 75,40 C75,55 65,65 50,65 C35,65 25,55 25,40 C25,25 30,15 40,10 Z" 
          fill="#FECACA" stroke="#EF4444" stroke-width="2" opacity="0.7"/>
    <path d="M75,40 C75,55 65,65 50,65 C50,80 60,90 75,90 C90,90 100,80 100,65 C100,50 90,40 75,40 Z" 
          fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>
    <path d="M25,40 C25,55 35,65 50,65 C50,80 40,90 25,90 C10,90 0,80 0,65 C0,50 10,40 25,40 Z" 
          fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" opacity="0.7"/>
    <path d="M25,90 C40,90 50,80 50,65 C50,65 50,65 50,65 C50,65 50,65 50,65 C50,80 60,90 75,90 C75,100 65,110 50,110 C35,110 25,100 25,90 Z" 
          fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Decorative element -->
  <path d="M5,20 L15,20" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M5,25 L10,25" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M5,30 L12,30" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
</svg>
