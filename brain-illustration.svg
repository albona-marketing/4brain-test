<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for each brain region -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECACA" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <!-- Filter for shadow effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <g transform="translate(40,30)">
    <!-- Brain outline with shadow -->
    <path d="M60,10 C90,0 120,20 120,50 C120,80 100,100 80,110 C60,120 40,120 20,110 C0,100 -20,80 -20,50 C-20,20 10,0 40,10 C50,5 50,5 60,10 Z" 
          fill="#f8f0ff" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Brain regions with gradients -->
    <!-- 支配者（爬虫類脳）- Red region -->
    <path d="M40,10 C50,5 50,5 60,10 C70,15 75,25 75,40 C75,55 65,65 50,65 C35,65 25,55 25,40 C25,25 30,15 40,10 Z" 
          fill="url(#redGradient)" stroke="#EF4444" stroke-width="1.5" opacity="0.9">
      <title>支配者（爬虫類脳）</title>
    </path>
    
    <!-- 遊戯者（哺乳類脳）- Yellow region -->
    <path d="M75,40 C75,55 65,65 50,65 C50,80 60,90 75,90 C90,90 100,80 100,65 C100,50 90,40 75,40 Z" 
          fill="url(#yellowGradient)" stroke="#F59E0B" stroke-width="1.5" opacity="0.9">
      <title>遊戯者（哺乳類脳）</title>
    </path>
    
    <!-- 観察者（人間脳・論理）- Blue region -->
    <path d="M25,40 C25,55 35,65 50,65 C50,80 40,90 25,90 C10,90 0,80 0,65 C0,50 10,40 25,40 Z" 
          fill="url(#blueGradient)" stroke="#3B82F6" stroke-width="1.5" opacity="0.9">
      <title>観察者（人間脳・論理）</title>
    </path>
    
    <!-- 求道者（人間脳・抽象）- Purple region -->
    <path d="M25,90 C40,90 50,80 50,65 C50,65 50,65 50,65 C50,65 50,65 50,65 C50,80 60,90 75,90 C75,100 65,110 50,110 C35,110 25,100 25,90 Z" 
          fill="url(#purpleGradient)" stroke="#8B5CF6" stroke-width="1.5" opacity="0.9">
      <title>求道者（人間脳・抽象）</title>
    </path>
    
    <!-- Brain details - neural connections -->
    <g opacity="0.6">
      <!-- Neural connections in red region -->
      <circle cx="45" cy="25" r="1.5" fill="#EF4444" />
      <circle cx="55" cy="30" r="1.5" fill="#EF4444" />
      <circle cx="65" cy="35" r="1.5" fill="#EF4444" />
      <path d="M45,25 Q50,27 55,30 Q60,32 65,35" fill="none" stroke="#EF4444" stroke-width="0.5" />
      
      <!-- Neural connections in yellow region -->
      <circle cx="85" cy="55" r="1.5" fill="#F59E0B" />
      <circle cx="75" cy="70" r="1.5" fill="#F59E0B" />
      <circle cx="90" cy="75" r="1.5" fill="#F59E0B" />
      <path d="M85,55 Q80,65 75,70 Q82,73 90,75" fill="none" stroke="#F59E0B" stroke-width="0.5" />
      
      <!-- Neural connections in blue region -->
      <circle cx="15" cy="55" r="1.5" fill="#3B82F6" />
      <circle cx="25" cy="70" r="1.5" fill="#3B82F6" />
      <circle cx="10" cy="75" r="1.5" fill="#3B82F6" />
      <path d="M15,55 Q20,65 25,70 Q18,73 10,75" fill="none" stroke="#3B82F6" stroke-width="0.5" />
      
      <!-- Neural connections in purple region -->
      <circle cx="35" cy="95" r="1.5" fill="#8B5CF6" />
      <circle cx="50" cy="100" r="1.5" fill="#8B5CF6" />
      <circle cx="65" cy="95" r="1.5" fill="#8B5CF6" />
      <path d="M35,95 Q42,98 50,100 Q58,98 65,95" fill="none" stroke="#8B5CF6" stroke-width="0.5" />
    </g>
  </g>
  
  <!-- Labels for brain regions (optional, can be hidden if too cluttered) -->
  <g transform="translate(40,30)" opacity="0" class="brain-labels">
    <text x="50" y="30" font-size="8" text-anchor="middle" fill="#EF4444">支配者</text>
    <text x="85" y="65" font-size="8" text-anchor="middle" fill="#F59E0B">遊戯者</text>
    <text x="15" y="65" font-size="8" text-anchor="middle" fill="#3B82F6">観察者</text>
    <text x="50" y="95" font-size="8" text-anchor="middle" fill="#8B5CF6">求道者</text>
  </g>
</svg>
